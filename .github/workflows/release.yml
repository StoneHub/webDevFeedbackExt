name: Release Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"

          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "package.json version $VERSION does not match manifest.json version $MANIFEST_VERSION" >&2
            exit 1
          fi

          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$VERSION" >&2
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP_PATH=dist/dev-feedback-capture-v$VERSION.zip" >> "$GITHUB_ENV"

      - name: Run tests
        run: npm test

      - name: Run release checks
        run: npm run check

      - name: Package extension
        run: npm run package

      - name: Verify package artifact
        run: test -f "$ZIP_PATH"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP_PATH" \
            --title "Dev Feedback Capture $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md
