<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Region Capture</title>
  <style>
    :root {
      --bg: #101211;
      --surface: #171a18;
      --surface-high: #202420;
      --surface-higher: #2a302b;
      --text: #edf2ee;
      --muted: #aeb9b0;
      --faint: #778276;
      --accent: #8ed8a0;
      --accent-strong: #5fba79;
      --danger: #f87171;
      --line: rgba(204, 221, 205, 0.16);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.48);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(142, 216, 160, 0.12), transparent 35%),
        linear-gradient(180deg, #111411 0%, #0b0d0c 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      min-height: 100vh;
    }

    .stage {
      min-width: 0;
      padding: 18px;
      overflow: auto;
    }

    .frame {
      position: relative;
      min-height: calc(100vh - 36px);
      display: grid;
      align-content: center;
      justify-items: center;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.025);
      box-shadow: var(--shadow);
    }

    .image-wrap {
      position: relative;
      display: inline-block;
      max-width: 100%;
      cursor: crosshair;
      user-select: none;
      border-radius: 8px;
      overflow: hidden;
      background: #0b0d0c;
      border: 1px solid var(--line);
      touch-action: none;
    }

    .image-wrap img {
      display: block;
      max-width: 100%;
    }

    .image-wrap:focus-visible {
      outline: 3px solid rgba(142, 216, 160, 0.5);
      outline-offset: 3px;
    }

    .selection {
      position: absolute;
      border: 2px solid var(--accent);
      background: rgba(142, 216, 160, 0.13);
      box-shadow: 0 0 0 9999px rgba(7, 8, 7, 0.46);
      pointer-events: none;
      display: none;
    }

    .selection.visible {
      display: block;
    }

    .sidebar {
      padding: 18px;
      background:
        radial-gradient(circle at 18% 0%, rgba(142, 216, 160, 0.12), transparent 34%),
        var(--surface);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 2px;
    }

    .mark {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid rgba(142, 216, 160, 0.66);
      color: var(--accent);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      font: 800 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      box-shadow: inset 0 0 0 1px rgba(142, 216, 160, 0.14);
    }

    h1 {
      font-size: 18px;
      line-height: 1.2;
      margin: 0;
    }

    .lede {
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
      margin: 3px 0 0;
    }

    .card {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--faint);
      margin-bottom: 8px;
      font-weight: 800;
    }

    .value {
      font-size: 13px;
      line-height: 1.45;
      word-break: break-word;
      color: var(--text);
    }

    textarea {
      width: 100%;
      min-height: 138px;
      resize: vertical;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 12px;
      font: inherit;
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
      background: #0b0d0c;
    }

    textarea::placeholder {
      color: var(--faint);
    }

    textarea:focus {
      outline: none;
      border-color: rgba(142, 216, 160, 0.7);
      box-shadow: 0 0 0 3px rgba(142, 216, 160, 0.12);
    }

    .counter {
      margin-top: 8px;
      text-align: right;
      color: var(--faint);
      font-size: 11px;
    }

    .actions {
      display: grid;
      gap: 9px;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 14px;
      min-height: 42px;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease, opacity 0.16s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 2px solid rgba(142, 216, 160, 0.5);
      outline-offset: 2px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      transform: none;
    }

    .primary {
      background: linear-gradient(180deg, #7ed693, #57b874);
      border-color: rgba(142, 216, 160, 0.48);
      color: #07120b;
    }

    .secondary {
      background: var(--surface-high);
      color: var(--text);
    }

    .secondary:hover {
      background: var(--surface-higher);
    }

    .danger {
      background: #2b1819;
      border-color: rgba(248, 113, 113, 0.34);
      color: #ffcaca;
    }

    .status {
      min-height: 18px;
      font-size: 12px;
      line-height: 1.4;
      color: var(--muted);
    }

    .error {
      color: #ffcaca;
    }

    .hint {
      margin-top: auto;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    @media (max-width: 980px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-left: none;
        border-top: 1px solid var(--line);
      }

      .frame {
        min-height: 52vh;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="stage">
      <div class="frame">
        <div class="image-wrap" id="image-wrap" tabindex="0" role="application" aria-label="Region selector. Press Enter to create a selection, arrow keys to move it, and Shift plus arrow keys to resize it." aria-describedby="selection-summary">
          <img id="screenshot-image" alt="Captured viewport screenshot">
          <div class="selection" id="selection-box"></div>
        </div>
      </div>
    </div>

    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="mark" aria-hidden="true">&lt;/&gt;</div>
        <div>
          <h1>Region Capture</h1>
          <p class="lede">Draw a crop, describe the requested change, and save it to local history.</p>
        </div>
      </header>

      <div class="card">
        <div class="label">Source</div>
        <div class="value" id="source-url"></div>
      </div>

      <div class="card">
        <div class="label">Selection</div>
        <div class="value" id="selection-summary">Draw a box on the screenshot.</div>
      </div>

      <div class="card">
        <label class="label" for="note-field">Requested Change</label>
        <textarea id="note-field" placeholder="Describe what should change in this region..."></textarea>
        <div class="counter" id="note-counter">0 / 2000</div>
      </div>

      <div class="actions">
        <button class="primary" id="save-btn">Save Region Feedback</button>
        <button class="secondary" id="reset-btn">Reset Selection</button>
        <button class="danger" id="cancel-btn">Cancel</button>
      </div>

      <p class="status" id="status-line" role="status" aria-live="polite"></p>
      <p class="hint">Mouse, touch, or pen: draw a box. Keyboard: press Enter, then move with arrow keys or resize with Shift + arrow keys. Press Escape to cancel.</p>
    </aside>
  </div>

  <script src="shared.js"></script>
  <script src="capture.js"></script>
</body>
</html>
