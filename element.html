<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capture Element Feedback</title><link rel="stylesheet" href="history.css"></head>
<body class="element-editor"><main class="shell"><h1>Capture Element Feedback</h1><p>Your draft is private to the extension. Save it locally, then review it in History before sharing.</p>
<p id="source"></p><details><summary>Captured element details</summary><pre id="target"></pre></details>
<form id="capture-form"><label for="note">What should change?</label><textarea id="note" maxlength="2000" required rows="5"></textarea><label for="acceptance">Acceptance checks (one per line)</label><textarea id="acceptance" maxlength="2000" rows="3"></textarea><p>Review the captured text before sharing from History. No form input values or surrounding parent text are collected.</p><button id="save" type="submit">Save to History</button> <button id="cancel" type="button" class="secondary">Cancel</button></form><p id="status" role="status" aria-live="polite"></p></main><script src="shared.js"></script><script src="editor-dialog.js"></script><script src="element.js"></script></body></html>
