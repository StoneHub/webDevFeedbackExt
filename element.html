<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write element feedback</title><link rel="stylesheet" href="element.css"></head>
<body>
  <form id="capture-form">
    <header><label for="note">What should change? <span class="muted">Optional</span></label><button id="cancel" type="button" aria-label="Close without saving">×</button></header>
    <textarea id="note" maxlength="2000" rows="3" placeholder="Leave blank to save just the element"></textarea>
    <div class="actions"><p id="status" role="status" aria-live="polite">Enter saves · Shift+Enter new line</p><button id="save" type="submit">Save</button></div>
  </form>
  <script src="element.js"></script>
</body>
</html>
