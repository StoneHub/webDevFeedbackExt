<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dev Feedback Capture</title>
  <style>
    * { box-sizing:border-box; }
    html, body { width:320px; margin:0; }
    body { padding:16px; font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#29263a; background:#faf9fd; }
    header { display:flex; align-items:center; gap:10px; }
    header img { width:28px; height:28px; }
    h1 { margin:0; font-size:16px; }
    h2 { margin:14px 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:#6f6a7d; }
    p { margin:10px 0; }
    button { padding:9px 12px; border:1px solid #d5d1e5; border-radius:8px; font:inherit; font-weight:600; cursor:pointer; background:white; color:#29263a; }
    #primary-action-btn { display:block; width:100%; margin-top:14px; padding:11px; background:#5b55c5; color:white; border-color:#5b55c5; font-weight:700; }
    button:disabled { opacity:.55; cursor:default; }
    button:focus-visible { outline:3px solid #aaa5ef; outline-offset:2px; }
    .hint { color:#6f6a7d; font-size:12px; }
    #warning { color:#a13232; }
    #frame-access { color:#4a4560; background:#efedfa; border-radius:8px; padding:8px 10px; font-size:12px; overflow-wrap:anywhere; }
    ol { list-style:none; margin:0; padding:0; max-height:260px; overflow-y:auto; border:1px solid #e5e2ee; border-radius:8px; background:white; }
    li { display:flex; gap:8px; align-items:flex-start; padding:7px 8px; border-top:1px solid #efedf5; }
    li:first-child { border-top:0; }
    li div { flex:1; min-width:0; }
    li code { display:block; font:11px/1.4 ui-monospace,Menlo,monospace; color:#4d479a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    li span { display:block; overflow-wrap:anywhere; }
    li .empty { color:#8a85a0; font-style:italic; }
    li button { border:0; padding:0 4px; font-size:16px; line-height:1.2; color:#8a85a0; background:transparent; }
    .actions { display:flex; gap:6px; margin-top:8px; }
    .actions button { flex:1; }
    footer { color:#6f6a7d; font-size:11px; border-top:1px solid #e5e2ee; margin-top:14px; padding-top:10px; }
    kbd { font:inherit; }
  </style>
</head>
<body>
  <header><img src="icon48.png" alt=""><h1>Dev Feedback Capture</h1></header>
  <button id="primary-action-btn" disabled>Pick an element</button>
  <p class="hint">Click an element, or Tab to it and press <kbd>Alt+Enter</kbd>. Each save copies this run to your clipboard. <kbd>Esc</kbd> stops.</p>
  <p id="frame-access" hidden></p>
  <p id="warning" role="alert" hidden></p>
  <button id="file-access-settings-btn" hidden>Open extension settings</button>
  <section id="captures" hidden>
    <h2>On this page (<span id="item-count">0</span>)</h2>
    <ol id="capture-list"></ol>
    <div class="actions"><button id="copy-btn">Copy all</button><button id="markdown-btn">Markdown</button><button id="json-btn">JSON</button></div>
  </section>
  <footer><kbd id="shortcut-label"></kbd> to start picking · Stays local until you copy or download</footer>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
