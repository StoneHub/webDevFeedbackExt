<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dev Feedback Capture</title>
  <style>
    * { box-sizing:border-box; }
    html, body { width:320px; margin:0; }
    body { padding:18px; font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#29263a; background:#faf9fd; }
    header { display:flex; align-items:center; gap:10px; }
    header img { width:30px; height:30px; }
    h1 { margin:0; font-size:17px; }
    p { margin:12px 0; }
    #page-label { color:#6f6a7d; overflow-wrap:anywhere; font-size:12px; }
    button { display:block; width:100%; padding:11px; margin:9px 0; border:1px solid #d5d1e5; border-radius:9px; font:inherit; font-weight:600; cursor:pointer; }
    #primary-action-btn { background:#5b55c5; color:white; border-color:#5b55c5; font-weight:700; }
    #history-btn { background:white; color:#29263a; }
    button:disabled { opacity:.55; cursor:default; }
    button:focus-visible { outline:3px solid #aaa5ef; outline-offset:2px; }
    #warning { color:#a13232; }
    footer { color:#6f6a7d; font-size:11px; border-top:1px solid #e5e2ee; margin-top:14px; padding-top:12px; }
    kbd { font:inherit; }
  </style>
</head>
<body>
  <header><img src="icon48.png" alt=""><h1>Dev Feedback Capture</h1></header>
  <p>Pick an element. Describe the change.</p>
  <p id="page-label">Current webpage</p>
  <button id="primary-action-btn" disabled>Pick an element</button>
  <button id="history-btn">History &amp; export</button>
  <p id="warning" role="alert" hidden></p>
  <footer><span id="item-count">0</span> saved on this site · Stays local until exported<br><kbd id="shortcut-label"></kbd> to start picking</footer>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
